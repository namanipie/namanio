<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — namanipie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
  --ground:    #0b0a0e;
  --ink:       #ededed;
  --ink-dim:   #999999;
  --ink-faint: #504860;
  --accent-red:    #a78bfa;
  --f-display: 'Instrument Serif', Georgia, serif;
  --f-body:    'Inter', system-ui, sans-serif;
  --f-mono:    'JetBrains Mono', 'Courier New', monospace;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--f-body);
  background: var(--ground) radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.05) 0%, transparent 70%);
  color: var(--ink);
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.grain {
  position: fixed; inset: 0; pointer-events: none; z-index: 100;
  opacity: 0.04;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}
h1 {
  font-family: var(--f-display);
  font-size: clamp(6rem, 15vw, 12rem);
  font-weight: 400;
  line-height: 1;
  color: var(--ink-dim);
  cursor: pointer;
  transition: color 0.3s, text-shadow 0.3s;
  user-select: none;
}
h1.glow {
  color: var(--accent-red);
  text-shadow: 0 0 40px rgba(167, 139, 250, 0.4);
}
p {
  font-family: var(--f-mono);
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-faint);
  margin-top: 24px;
}
a {
  margin-top: 48px;
  font-family: var(--f-mono);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink);
  text-decoration: none;
  border-bottom: 1px solid var(--ink-faint);
  padding-bottom: 4px;
  transition: border-color 0.2s, color 0.2s;
}
a:hover {
  border-color: var(--ink);
  color: var(--accent-red);
}
.whisper {
  position: fixed; bottom: 32px;
  font-family: var(--f-mono); font-size: 0.65rem; color: var(--ink-faint);
  opacity: 0; transition: opacity 1s;
}
</style>
</head>
<body>
<div class="grain"></div>

<h1 id="errorTitle">404</h1>
<p>there's nothing here.</p>
<a href="/">go back ↗</a>

<div class="whisper" id="whisper">okay fine. hi. now go back.</div>

<script>
let clicks = 0;
const title = document.getElementById('errorTitle');
const whisper = document.getElementById('whisper');
const msg = document.querySelector('p');

title.addEventListener('click', () => {
  clicks++;
  if (clicks === 1) {
    msg.innerText = "you're still here?";
  } else if (clicks === 2) {
    msg.innerText = "seriously, there's nothing to find.";
  } else if (clicks === 3) {
    title.classList.add('glow');
    whisper.style.opacity = '1';
  }
});
</script>
</body>
</html>
